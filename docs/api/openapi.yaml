openapi: 3.0.3
info:
  title: Evenly API
  version: 1.0.0
  description: |
    API de Evenly, gestor de gastos compartidos.

    - Autenticación: `Authorization: Bearer <token>` (JWT HS256, se obtiene en /auth/login o /auth/register).
    - Montos: números JSON con máximo 2 decimales, entre 0.01 y 1,000,000. Internamente se guardan en centavos.
    - Errores: siempre `{ "error": { "code", "message", "details?" } }`.
    - Si un usuario no pertenece a un grupo, la API responde 404 (no 403) para no revelar que existe.
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://CAMBIAR.onrender.com
    description: Producción (Render)

tags:
  - name: Salud
  - name: Auth
  - name: Usuarios
  - name: Grupos
  - name: Gastos
  - name: Actividad

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Salud]
      summary: Estado del servicio y de la base de datos
      security: []
      responses:
        "200":
          description: Todo disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: string, example: ok }
        "503":
          description: La base de datos no responde

  /auth/register:
    post:
      tags: [Auth]
      summary: Crear cuenta
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: "EMAIL_TAKEN: ya existe una cuenta con ese correo"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: "Correo o contraseña incorrectos (mismo mensaje si el correo no existe)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Usuario de la sesión actual
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users:
    get:
      tags: [Usuarios]
      summary: Buscar usuarios por nombre o correo (para agregarlos a un grupo)
      description: Excluye al usuario actual. Máximo 10 resultados. `%`, `_` y `\` se buscan como texto literal.
      parameters:
        - name: search
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /groups:
    get:
      tags: [Grupos]
      summary: Grupos del usuario (más recientes primero)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Grupos]
      summary: Crear grupo (el creador queda como ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupInput" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/GroupDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/groupId"
    get:
      tags: [Grupos]
      summary: Detalle del grupo con balances y pagos sugeridos
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/GroupDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Grupos]
      summary: Editar grupo (solo ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroupInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/GroupDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Grupos]
      summary: Eliminar grupo y sus gastos (solo ADMIN)
      responses:
        "204": { description: Eliminado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/groupId"
    post:
      tags: [Grupos]
      summary: Agregar integrante (solo ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "201":
          description: Agregado
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/GroupDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "ALREADY_MEMBER"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/groupId"
      - name: userId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Grupos]
      summary: Quitar integrante (ADMIN) o salir del grupo (uno mismo)
      description: No se permite si el integrante pagó o participa en algún gasto (MEMBER_HAS_EXPENSES), ni que el ADMIN salga (ADMIN_CANNOT_LEAVE).
      responses:
        "204": { description: Quitado }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "MEMBER_HAS_EXPENSES | ADMIN_CANNOT_LEAVE"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/expenses:
    parameters:
      - $ref: "#/components/parameters/groupId"
    get:
      tags: [Gastos]
      summary: Gastos del grupo (más recientes primero)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  expenses:
                    type: array
                    items: { $ref: "#/components/schemas/Expense" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Gastos]
      summary: Registrar gasto
      description: |
        - `equal`: el servidor reparte el total entre los participantes; los centavos sobrantes van a los primeros (100 / 3 = 33.34 + 33.33 + 33.33).
        - `itemized`: cada participante necesita `amount` y la suma debe ser exactamente el total (SPLIT_MISMATCH si no).
        - Quien paga y los participantes deben ser integrantes del grupo (NOT_A_MEMBER).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExpenseInput" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  expense: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/groupId"
      - name: expenseId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Gastos]
      summary: Detalle de un gasto
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  expense: { $ref: "#/components/schemas/Expense" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Gastos]
      summary: Eliminar gasto (quien lo creó, quien pagó o el ADMIN)
      responses:
        "204": { description: Eliminado }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /activity:
    get:
      tags: [Actividad]
      summary: Gastos recientes de todos los grupos del usuario
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: paidByMe
          in: query
          description: true = solo gastos pagados por el usuario (historial de pagos)
          schema: { type: string, enum: ["true", "false"], default: "false" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        expense: { $ref: "#/components/schemas/Expense" }
                        group:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            category: { $ref: "#/components/schemas/Category" }
                            theme: { $ref: "#/components/schemas/Theme" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    groupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }

  schemas:
    Category:
      type: string
      enum: [grupo, comida, amigos, transporte, entretenimiento]
    Theme:
      type: string
      enum: [ice, sky, pink]
    Amount:
      type: number
      minimum: 0.01
      maximum: 1000000
      multipleOf: 0.01
      example: 125.5

    User:
      type: object
      properties:
        id: { type: string, example: cmukho8ro0000aonb8zipyzql }
        name: { type: string, example: Ana López }
        email: { type: string, example: ana@evenly.app }
        avatarColor: { $ref: "#/components/schemas/Theme" }

    RegisterInput:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Al menos una minúscula, una mayúscula, un número y un símbolo.
          example: Prueba2026!

    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
      example:
        email: ana@evenly.app
        password: Evenly2026!

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    CreateGroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        category: { $ref: "#/components/schemas/Category" }
        theme: { $ref: "#/components/schemas/Theme" }
        memberIds:
          type: array
          maxItems: 20
          items: { type: string }

    UpdateGroupInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        category: { $ref: "#/components/schemas/Category" }
        theme: { $ref: "#/components/schemas/Theme" }

    Member:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            role: { type: string, enum: [ADMIN, MIEMBRO] }

    Group:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        theme: { $ref: "#/components/schemas/Theme" }
        createdById: { type: string }
        createdAt: { type: string, format: date-time }
        memberIds:
          type: array
          items: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        myBalance:
          type: number
          description: Positivo = te deben; negativo = debes.
        expenseCount: { type: integer }
        totalSpent: { type: number }

    GroupDetail:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          properties:
            balances:
              type: array
              items:
                type: object
                properties:
                  userId: { type: string }
                  net: { type: number }
            settlements:
              type: array
              description: Pagos sugeridos para dejar a todos en 0.
              items:
                type: object
                properties:
                  fromUserId: { type: string }
                  toUserId: { type: string }
                  amount: { type: number }

    CreateExpenseInput:
      type: object
      additionalProperties: false
      required: [description, amount, paidById, splitType, participants]
      properties:
        description: { type: string, minLength: 1, maxLength: 100 }
        amount: { $ref: "#/components/schemas/Amount" }
        paidById: { type: string }
        splitType: { type: string, enum: [equal, itemized] }
        category: { $ref: "#/components/schemas/Category" }
        participants:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [userId]
            properties:
              userId: { type: string }
              amount:
                $ref: "#/components/schemas/Amount"

    Expense:
      type: object
      properties:
        id: { type: string }
        groupId: { type: string }
        description: { type: string }
        amount: { type: number }
        paidById: { type: string }
        paidBy: { $ref: "#/components/schemas/User" }
        splitType: { type: string, enum: [equal, itemized] }
        participants:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              amount: { type: number }
        category: { $ref: "#/components/schemas/Category" }
        createdById: { type: string }
        createdAt: { type: string, format: date-time }

    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: El monto debe ser mayor a 0.
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

  responses:
    ValidationError:
      description: "VALIDATION_ERROR, INVALID_JSON, SPLIT_MISMATCH, NOT_A_MEMBER, DUPLICATE_PARTICIPANT o USER_NOT_FOUND"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "UNAUTHORIZED: falta el token, es inválido o expiró"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "FORBIDDEN: es integrante pero no tiene el rol necesario"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "NOT_FOUND: no existe o el usuario no pertenece al grupo"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: "PAYLOAD_TOO_LARGE: cuerpo mayor a 100 KB"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: "TOO_MANY_REQUESTS: demasiados intentos de login/registro desde la misma IP"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
